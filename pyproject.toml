[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "MyProject"
version = "0.1.0"
description = "Production-grade RAG application with LangGraph"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.5",
    "datasets>=4.8.4",
    "evaluate>=0.4.6",
    "ipykernel>=7.2.0",
    "langchain>=1.2.13",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.22",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.9.1",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.12.0",
    "streamlit>=1.45.0",
    "sentence-transformers>=4.1.0",
    "ragas>=0.2.15",
    "pytest>=8.0.0",
]
